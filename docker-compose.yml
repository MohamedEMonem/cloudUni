services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - frontend_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-mydb}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - frontend_redis_data:/data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - frontend_meili_data:/meili_data
    restart: unless-stopped

  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rootpassword}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - frontend_minio_data:/data
    restart: unless-stopped


  backend:
    image: marwanmw/dokkan-backend:__BUILD_NUMBER__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
      minio:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-admin}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5000}
      DATABASE_URL: postgres://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-mydb}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MEILI_HOST: meilisearch
      MEILI_PORT: 7700
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rootpassword}
      AUTO_SEED: ${AUTO_SEED:-true}
      DB_WAIT_RETRIES: ${DB_WAIT_RETRIES:-60}
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
  frontend:
    image: marwanmw/dokkan-frontend:__BUILD_NUMBER__
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: ${FRONTEND_PORT:-5000}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "${FRONTEND_PORT:-5000}:5000"
    restart: unless-stopped

volumes:
  frontend_postgres_data:
  frontend_redis_data:
  frontend_meili_data:
  frontend_minio_data:
