services:
  redis:
    image: redis:alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - nx_network
    restart: unless-stopped

  backend:
    image: mohamedemonem/dokkan-backend:__BUILD_NUMBER__
    # 1. DELETE the env_file lines
    # 2. ADD this environment block to map the variables from Elastic Beanstalk
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN}
      - REFRESH_TOKEN_PREFIX=${REFRESH_TOKEN_PREFIX}
      - REFRESH_COOKIE_NAME=${REFRESH_COOKIE_NAME}
      - REFRESH_COOKIE_SAMESITE=${REFRESH_COOKIE_SAMESITE}
      - REFRESH_COOKIE_SECURE=${REFRESH_COOKIE_SECURE}
      - REFRESH_COOKIE_PATH=${REFRESH_COOKIE_PATH}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - DATABASE_URL=${DATABASE_URL} 
      - REDIS_URL=${REDIS_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_PORT=${MEILI_PORT}
      - MEILI_HOST=${MEILI_HOST:-nx_meilisearch}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - AUTO_SEED=${AUTO_SEED}
      - DB_WAIT_RETRIES=${DB_WAIT_RETRIES}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - nx_network
    restart: unless-stopped

  frontend:
    image: mohamedemonem/dokkan-frontend:__BUILD_NUMBER__
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
    ports:
      # FIX: Route Host Port 80 to Container Port 80 (Nginx)
      - "80:80"
    networks:
      - nx_network
    restart: unless-stopped
    
networks:
  nx_network:
    driver: bridge

volumes:
  redis_data:
