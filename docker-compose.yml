services:
  # -----------------------------
  # PostgreSQL (Database)
  # -----------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nx_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-my_app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nx_network
    restart: always

  # -----------------------------
  # Redis (Cache/Queue)
  # -----------------------------
  redis:
    image: redis:alpine
    container_name: nx_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nx_network
    restart: always

  # -----------------------------
  # Meilisearch (Search Engine)
  # -----------------------------
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: nx_meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    networks:
      - nx_network
    restart: always

  # -----------------------------
  # MinIO (S3 Compatible Storage)
  # -----------------------------
  minio:
    image: minio/minio
    container_name: nx_minio
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console Port
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # MinIO command to start server and define console port
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - nx_network
    restart: always

  # -----------------------------
  # Mailpit (Local Email Testing)
  # -----------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: nx_mailpit
    ports:
      - "8025:8025" # Web UI (View your emails in the browser)
      - "1025:1025" # SMTP Port (What your Backend connects to)
    environment:
      # Optional: Keep the container lightweight by only storing the last 500 emails
      - MP_MAX_MESSAGES=500
    networks:
      - nx_network
    restart: always

  backend:
    image: marwanmw/dokkan-backend
    env_file:
      - ./Backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
      minio:
        condition: service_started
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
  frontend:
    image: marwanmw/dokkan-frontend
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: ${FRONTEND_PORT:-5000}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "${FRONTEND_PORT:-5000}:5000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  meili_data:
  minio_data:

networks:
  nx_network:
    driver: bridge