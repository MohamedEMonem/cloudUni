services:
  # -----------------------------
  # PostgreSQL (Database)
  # -----------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nx_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-my_app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nx_network
    restart: always

  # -----------------------------
  # Redis (Cache/Queue)
  # -----------------------------
  redis:
    image: redis:alpine
    container_name: nx_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nx_network
    restart: always

  # -----------------------------
  # Meilisearch (Search Engine)
  # -----------------------------
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: nx_meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    networks:
      - nx_network
    restart: always

  # -----------------------------
  # Mailpit (Local Email Testing)
  # -----------------------------


  backend:
    image: marwanmw/dokkan-backend:__BUILD_NUMBER__
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
  frontend:
    image: marwanmw/dokkan-frontend:__BUILD_NUMBER__
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: ${FRONTEND_PORT:-5000}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "${FRONTEND_PORT:-5000}:5000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  meili_data:

networks:
  nx_network:
    driver: bridge