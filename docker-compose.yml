services:
  # -----------------------------
  # PostgreSQL (Database)
  # -----------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nx_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-my_app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nx_network
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-admin} -d $${POSTGRES_DB:-my_app_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Redis (Cache/Queue)
  # -----------------------------
  redis:
    image: redis:alpine
    container_name: nx_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nx_network
    restart: always

  # -----------------------------
  # Meilisearch (Search Engine)
  # -----------------------------
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: nx_meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-masterKey}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    networks:
      - nx_network
    restart: always

  # -----------------------------
  # Mailpit (Local Email Testing)
  # -----------------------------

  backend:
    image: mohamedemonem/dokkan-backend:__BUILD_NUMBER__
    # 1. DELETE the env_file lines
    # 2. ADD this environment block to map the variables from Elastic Beanstalk
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - JWT_SECRET=${JWT_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
      - REFRESH_TOKEN_EXPIRES_IN=${REFRESH_TOKEN_EXPIRES_IN}
      - REFRESH_TOKEN_PREFIX=${REFRESH_TOKEN_PREFIX}
      - REFRESH_COOKIE_NAME=${REFRESH_COOKIE_NAME}
      - REFRESH_COOKIE_SAMESITE=${REFRESH_COOKIE_SAMESITE}
      - REFRESH_COOKIE_SECURE=${REFRESH_COOKIE_SECURE}
      - REFRESH_COOKIE_PATH=${REFRESH_COOKIE_PATH}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_PORT=${MEILI_PORT}
      - MEILI_HOST=${MEILI_HOST:-nx_meilisearch}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME}
      - AWS_S3_REGION=${AWS_S3_REGION}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - AUTO_SEED=${AUTO_SEED}
      - DB_WAIT_RETRIES=${DB_WAIT_RETRIES}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      meilisearch:
        condition: service_started
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped

  frontend:
    image: mohamedemonem/dokkan-frontend:__BUILD_NUMBER__
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
    ports:
      # This is the magic line: Host Port 80 -> Container Port 5000
      - "80:5000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  meili_data:

networks:
  nx_network:
    driver: bridge
